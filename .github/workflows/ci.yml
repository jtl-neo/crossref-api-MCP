name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest --cov=src/crossref_mcp --cov-report=term-missing --cov-report=xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan (deps + config)
        # report only; does not fail the build (first version)
        run: trivy fs --scanners vuln,secret,misconfig --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 .

  build-push:
    needs: [test]
    runs-on: ubuntu-latest
    # Only publish on pushes to main or version tags — never on PRs.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != pyproject version $VER"; exit 1; }
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: heyinnaneo/crossref-mcp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The MCP registry reads the server-name as an OCI *annotation* on the
          # image index/manifest (not just a config label), so set it explicitly.
          annotations: |
            index,manifest:io.modelcontextprotocol.server.name=io.github.jtl-neo/crossref-mcp
          # Disable provenance/SBOM attestation manifests — they clutter the index
          # and hide the annotation the registry looks for.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish to PyPI on version tags via OIDC Trusted Publisher (no stored token).
  publish-pypi:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build distributions
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # safe to re-run; never fails on an already-uploaded version

  # Register the release with the official MCP registry.
  publish-registry:
    needs: [publish-pypi, build-push]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # GitHub OIDC -> registry namespace auth
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar -xz mcp-publisher && sudo mv mcp-publisher /usr/local/bin/
      - name: Login (GitHub OIDC)
        run: mcp-publisher login github-oidc
      - name: Publish
        # Retry: the registry validates the PyPI package, which can lag a minute
        # behind a fresh upload (publish-pypi runs just before this job).
        run: |
          for attempt in 1 2 3 4 5; do
            if mcp-publisher publish; then
              echo "published on attempt $attempt"; exit 0
            fi
            echo "publish attempt $attempt failed; retrying in 30s..."
            sleep 30
          done
          echo "::error::mcp-publisher publish failed after 5 attempts"
          exit 1
