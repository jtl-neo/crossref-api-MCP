[project]
name = "crossref-mcp"
version = "0.1.0"
description = "MCP server wrapping the Crossref REST API for scholarly metadata."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "crossref-mcp contributors", email = "ljthub@gmail.com" }]
keywords = ["mcp", "crossref", "doi", "scholarly", "metadata"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Optional: Redis-backed response cache + cross-replica rate limiting (M9).
redis = ["redis>=5"]

[project.urls]
Homepage = "https://github.com/heyinnaneo/crossref-mcp"
Repository = "https://github.com/heyinnaneo/crossref-mcp"

[project.scripts]
crossref-mcp = "crossref_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5",
    "redis>=5",
    "fakeredis[lua]>=2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crossref_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits the real Crossref API (deselected by default; needs CROSSREF_LIVE=1)",
]
addopts = "-m 'not live'"
